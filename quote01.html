<!DOCTYPE html>

<style>
:root{
  --bg:#06111F;
  --t1:#F4F8FF;--t2:#B9C7D8;--t3:#9FB2C7;
  --blue:#4DA3FF;--blue3:#6EC6FF;
  --border:rgba(110,198,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:16px/1.6 Inter,sans-serif;
  background:var(--bg);color:var(--t1);
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}

/* NAV */
.nav{
  background:rgba(6,17,31,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.nav-inner{display:flex;align-items:center;gap:24px;padding:14px 28px;max-width:1320px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px}
.logo-img{width:44px;height:44px;flex-shrink:0;object-fit:contain;border-radius:10px;
  filter:brightness(0) saturate(100%) invert(57%) sepia(98%) saturate(1316%) hue-rotate(190deg) brightness(101%) contrast(101%)}
.logo .lt b{font-weight:900;font-size:15px;line-height:1.05;letter-spacing:-.3px;display:block}
.logo .lt span{font-size:8px;color:var(--t3);letter-spacing:1.4px;display:block;margin-top:3px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nav-link{font-size:13px;font-weight:500;color:var(--t2);padding:7px 12px;border-radius:7px;transition:.15s;border:1px solid transparent}
.nav-link:hover{color:var(--t1);border-color:var(--border);background:rgba(77,163,255,.06)}
.nav-link.primary{background:var(--blue);color:#fff;border-color:transparent;font-weight:600}
.nav-link.primary:hover{background:var(--blue3)}
.phone-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;
  border:1.5px solid var(--blue3);font-weight:600;font-size:13px;color:var(--t1);
}
.phone-btn svg{width:14px;height:14px;color:var(--blue)}

/* MAIN */
main{flex:1;display:flex;justify-content:center;padding:48px 28px 64px}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:24px 28px;text-align:center;font-size:12px;color:var(--t3)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <img class="logo-img" src="https://raw.githubusercontent.com/gblservers/rooftopheroes/refs/heads/main/logo1.png" alt="Rooftop Heroes">
      <div class="lt"><b>ROOFTOP HEROES</b><span>ROOFING · GUTTERS · INSULATION</span></div>
    </a>
    <div class="nav-right">
      <a href="tel:7342011000" class="phone-btn">

        (734) 201-1000
      </a>
      <a href="index.html" class="nav-link primary">← Main Site</a>
    </div>
  </div>
</nav>

<main>

  </div>
</main>

</html>
