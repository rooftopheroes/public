.nav-link:hover{color:var(--t1);border-color:var(--border);background:rgba(77,163,255,.06)}
.nav-link.primary{background:var(--blue);color:#fff;border-color:transparent;font-weight:600}
.nav-link.primary:hover{background:var(--blue3)}
.phone-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;
  border:1.5px solid var(--blue3);font-weight:600;font-size:13px;color:var(--t1);
}
.phone-btn svg{width:14px;height:14px;color:var(--blue)}

/* MAIN */
main{flex:1;display:flex;justify-content:center;padding:48px 28px 64px}

/*
  WIDGET CONTAINMENT STRATEGY — stacked fixes:

  1. #clip-box  — fixed 700px wide, overflow:hidden clips anything wider,
                  isolates the widget from the rest of the page layout.
  2. #scale-box — transform:scale() shrinks the widget's rendered output
                  to fit inside clip-box. Works even on full-vw iframes
                  because transform applies AFTER layout.
                  transform-origin:top left keeps it anchored correctly.
  3. JS below   — measures clip-box width vs actual rendered widget width
                  and sets the exact scale factor dynamically so it's
                  correct on every screen size.
  4. #clip-box height is set by JS to match the scaled content height,
                  so the page doesn't have a giant gap.
*/
#clip-box{
  width:700px;
  max-width:100%;
  overflow:hidden;
  position:relative;
  border-radius:14px;
  border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
#scale-box{
  transform-origin:top left;
  /* scale set by JS once widget renders */
}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:24px 28px;text-align:center;font-size:12px;color:var(--t3)}
</style>

    </div>
  </div>

<script src="https://app.roofle.com/roof-quote-pro-embedded-widget.js?id=6VD02-sC9VtQT_bSwTMPY" async></script>

<script>
(function(){
  var clipBox   = document.getElementById('clip-box');
  var scaleBox  = document.getElementById('scale-box');
  var embedDiv  = document.getElementById('roof-quote-pro-embedded');

  function applyScale(){
    // Reset scale so we can measure true rendered width
    scaleBox.style.transform = 'scale(1)';
    scaleBox.style.width = '';

    var naturalW = embedDiv.scrollWidth || scaleBox.scrollWidth;
    var targetW  = clipBox.clientWidth;

    if(naturalW <= 0 || targetW <= 0) return;

    var scale = targetW / naturalW;
    if(scale >= 1) return; // widget is already narrower than clip-box, nothing to do

    scaleBox.style.transform = 'scale(' + scale + ')';
    scaleBox.style.width = naturalW + 'px'; // prevent layout bleed
    // Shrink clip-box height to match scaled content so there's no gap
    var naturalH = scaleBox.scrollHeight;
    clipBox.style.height = (naturalH * scale) + 'px';
  }

  // Run once after widget likely loaded, then keep watching for content changes
  var attempts = 0;
  var interval = setInterval(function(){
    attempts++;
    applyScale();
    if(attempts > 40) clearInterval(interval); // stop after ~20s
  }, 500);

  // Also re-apply on resize
  window.addEventListener('resize', applyScale);
})();
</script>
